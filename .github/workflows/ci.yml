name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Typecheck, tests and production build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run verify:ci

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  electron-e2e:
    name: Electron recovery E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install CJK fonts for visual regression
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-cache --force

      - name: Regenerate Linux Electron visual baselines
        run: xvfb-run --auto-servernum npx playwright test --update-snapshots

      - name: Upload regenerated visual baselines
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-linux-visual-baselines
          path: |
            e2e/agent-recovery.spec.ts-snapshots/*-linux.png
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
